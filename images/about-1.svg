<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Faheem Electronics journey: an electronics shop in Saddar since 2010, today a full-service solar company with over 1,200 systems and 5 MW installed">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05a27"/>
      <stop offset="1" stop-color="#d94718"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f05a27" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#f05a27" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eef1f4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" rx="22" fill="#ffffff"/>
  <rect width="800" height="600" rx="22" fill="url(#grid)"/>
  <rect width="800" height="600" rx="22" fill="url(#wash)"/>
  <rect x="0.75" y="0.75" width="798.5" height="598.5" rx="21.25" fill="none" stroke="#e6eaee" stroke-width="1.5"/>

  <!-- eyebrow -->
  <rect x="56" y="58" width="34" height="3" rx="1.5" fill="#f05a27"/>
  <text x="102" y="64" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="bold" letter-spacing="3.5" fill="#f05a27">OUR JOURNEY</text>

  <!-- timeline spine -->
  <line x1="78" y1="132" x2="78" y2="330" stroke="url(#fade)" stroke-width="3" stroke-linecap="round"/>

  <!-- 2010 -->
  <circle cx="78" cy="138" r="9" fill="#ffffff" stroke="#f05a27" stroke-width="3.5"/>
  <text x="118" y="128" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#f05a27">2010</text>
  <text x="118" y="160" font-family="Verdana, Geneva, sans-serif" font-size="19" font-weight="bold" fill="#1a1d21">Electronics &amp; UPS shop</text>
  <text x="118" y="186" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#5f6b76">Regal Chowk, Saddar &#183; Karachi</text>

  <!-- today -->
  <circle cx="78" cy="324" r="9" fill="#f05a27"/>
  <circle cx="78" cy="324" r="17" fill="none" stroke="#f05a27" stroke-opacity="0.25" stroke-width="2"/>
  <text x="118" y="314" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#f05a27">TODAY</text>
  <text x="118" y="346" font-family="Verdana, Geneva, sans-serif" font-size="19" font-weight="bold" fill="#1a1d21">Full-service solar company</text>
  <text x="118" y="372" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#5f6b76">Panels &#183; System design &#183; Net metering</text>

  <!-- divider -->
  <line x1="56" y1="424" x2="744" y2="424" stroke="#e6eaee" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- stats -->
  <text x="140" y="486" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#1a1d21">1,200+</text>
  <text x="140" y="514" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" letter-spacing="1.2" fill="#5f6b76">SYSTEMS INSTALLED</text>

  <line x1="285" y1="462" x2="285" y2="522" stroke="#e6eaee" stroke-width="1.5"/>

  <text x="400" y="486" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#1a1d21">5 MW</text>
  <text x="400" y="514" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" letter-spacing="1.2" fill="#5f6b76">TOTAL CAPACITY</text>

  <line x1="515" y1="462" x2="515" y2="522" stroke="#e6eaee" stroke-width="1.5"/>

  <text x="645" y="486" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#1a1d21">3&#8211;100kW+</text>
  <text x="645" y="514" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" letter-spacing="1.2" fill="#5f6b76">HOME TO INDUSTRIAL</text>

  <text x="400" y="564" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#9aa5af">Faheem Electronics Solar Energy &#183; Karachi</text>
</svg>
